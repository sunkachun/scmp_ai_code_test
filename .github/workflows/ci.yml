name: CI

on:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env
        run: echo "REQRES_API_KEY=dummy_key" > .env

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
